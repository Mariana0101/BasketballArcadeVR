<!DOCTYPE html>
<html lang="en">
<head>
  <title>Basketball Arcade</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background-color: #1a1a2e; }

    #hud {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 9999;
    }
    .hud-panel {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 5px 12px;
    }
    .hud-label {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .hud-value {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      min-width: 48px;
      text-align: right;
    }
    #timer-value.urgent {
      color: #ff4444;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 1; }
      to   { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-panel">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="timer-value">2:00</span>
    </div>
    <div class="hud-panel">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="score-value">0</span>
    </div>
  </div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
      "cannon-es-debugger": "https://cdn.jsdelivr.net/npm/cannon-es-debugger@1.0.0/dist/cannon-es-debugger.js"
    }
  }
</script>

<script type="module">

  import * as THREE from 'three';
  import * as CANNON from 'cannon-es';
  import { VRButton } from 'three/addons/webxr/VRButton.js';
  import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import CannonDebugger from 'cannon-es-debugger';

  const MODEL_PATH = 'Arcade_machine.glb';
  const BUTTON_NAMES = ['Button_Classic', 'Button_levels'];
  const DIVIDER  = 'Separate';
  const LASER_LENGTH = 5;
  const PRESS_DEPTH = 0.01;
  const DIVIDER_DROP_AMOUNT = 1.5;
  const DIVIDER_SPEED = 0.008;
  const GAME_DURATION = 120;

  let camera, scene, renderer, raycaster;
  let controller1, controller2, controllerGrip1, controllerGrip2;
  let floor, player, marker, objects, matBounce, matFloor, physicsWorld;
  let group, cannonDebugger;

  const clock = new THREE.Clock();
  const buttons = [];
  const hovered = [];

  let dividerMesh = null;
  let dividerBody = null;
  let dividerRestY = null;
  let dividerTargetY = null;
  let gameRunning = false;

  let timerSecondsLeft = GAME_DURATION;
  let timerLastTimestamp = null;
  let timerRunning = false;

  let textLevelsMesh = null;
  let textClassicMesh = null;

  let score = 0;

  let hoopMesh = null;
  let hoopDirection = 1;
  let hoopSpeed = 0.008;
  let isLevelMode = false;
  let hoopVerticalDir = 1;
  let currentLevel = 1;
  let levelTimer = 0;
  let hoopOrigin = null;

  let hoopSensor = null;
  const scoredBalls = new Set(); 

  let heldObject = null;
  let holdinController  = null;
  let prevControllerPos = new THREE.Vector3();

  const textureLoader = new THREE.TextureLoader();

  const elTimer = document.getElementById('timer-value');
  const elScore = document.getElementById('score-value');

  init();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 10, 30);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);

    physicsWorld = new CANNON.World();
    physicsWorld.gravity.set(0, -9.82, 0);

    matBounce = new CANNON.Material('bouncy');
    matFloor  = new CANNON.Material('floor');

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 3);
    dirLight.position.set(2, 4, 2);
    scene.add(dirLight);

    physicsWorld.addContactMaterial(new CANNON.ContactMaterial(matBounce, matFloor, {
      friction: 0.3, restitution: 0.7
    }));

    floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0, metalness: 0, transparent: true, opacity: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    objects = [];
    const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: matFloor });
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    physicsWorld.addBody(floorBody);

    group = new THREE.Group();
    scene.add(group);

    new THREE.TextureLoader().load('background_VR.jpeg', (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = tex;
      scene.environment = tex;
    });

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setAnimationLoop(animate);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    raycaster = new THREE.Raycaster();

    controller1 = renderer.xr.getController(0);
    controller1.addEventListener('selectstart', onSelectStart);
    controller1.addEventListener('selectend',   onSelectEnd);
    controller1.addEventListener('squeezestart', onSqueezeStart);

    controller2 = renderer.xr.getController(1);
    controller2.addEventListener('selectstart', onSelectStart);
    controller2.addEventListener('selectend',   onSelectEnd);
    controller2.addEventListener('squeezestart', onSqueezeStart);

    const controllerModelFactory = new XRControllerModelFactory();
    controllerGrip1 = renderer.xr.getControllerGrip(0);
    controllerGrip2 = renderer.xr.getControllerGrip(1);

    player = new THREE.Group();
    player.add(camera, controller1, controller2, controllerGrip1, controllerGrip2);
    scene.add(player);
    player.position.set(0, 0.6, 0);

    renderer.xr.addEventListener('sessionstart', () => {
      controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
      controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
    });

    marker = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.15, 32),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide })
    );
    marker.rotation.x = -Math.PI / 2;
    marker.visible = false;
    scene.add(marker);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)
    ]);
    const laserLine = new THREE.Line(laserGeo, new THREE.LineBasicMaterial({ color: 0xff6600 }));
    laserLine.name = 'laser';
    laserLine.scale.z = LASER_LENGTH;
    controller1.add(laserLine.clone());
    controller2.add(laserLine.clone());

    const debugGroup = new THREE.Group();
    debugGroup.visible = true;
    scene.add(debugGroup);
    cannonDebugger = CannonDebugger(debugGroup, physicsWorld);

    loadArcadeModel();
    createBall();
    createBall();
    createBall();
    createBall();
    createBall();
    createBall();
    updateHUD(GAME_DURATION);
    window.addEventListener('resize', onWindowResize);
  }

  function updateHUD(secondsLeft) {
    const mins = Math.floor(secondsLeft / 60);
    const secs = Math.floor(secondsLeft) % 60;
    elTimer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    secondsLeft <= 10 ? elTimer.classList.add('urgent') : elTimer.classList.remove('urgent');
  }

  function addScore(points = 1) {
    score += points;
    elScore.textContent = score;
  }

  // Model
  function loadArcadeModel() {
    const loader = new GLTFLoader();
    loader.load(MODEL_PATH, (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.75, 0.75, 0.75);
      model.rotation.y = Math.PI / 2;
      model.position.set(0, 0, -3);
      scene.add(model);

      model.traverse(c => { if (c.isMesh) console.log('Mesh found:', c.name); });

      model.traverse((child) => {
        if (!child.isMesh) return;
        const nl = child.name.toLowerCase();

        if(child.name === "Text_Levels"){
          textLevelsMesh = child;
          child.material = child.material.clone();
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 3;
          return;
        }

        if(child.name === "Text_Classic"){
          textClassicMesh = child;
          child.material = child.material.clone();
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 3;
          return;
        }

        if (nl === DIVIDER.toLowerCase()) {
          dividerMesh  = child;
          dividerRestY = child.position.y;
          console.log('Divider at Y=' + dividerRestY.toFixed(3));
          child.updateWorldMatrix(true, false);

          if (!child.geometry) return;

          child.geometry.computeBoundingBox();

          const bb = child.geometry.boundingBox.clone();
          bb.applyMatrix4(child.matrixWorld);

          const sz = new THREE.Vector3();
          const cn = new THREE.Vector3();

          bb.getSize(sz);
          bb.getCenter(cn);

          const body = new CANNON.Body({ mass: 0, material: matFloor });
          body.type = CANNON.Body.KINEMATIC;

          const meshWorldPos = new THREE.Vector3();
          dividerMesh.getWorldPosition(meshWorldPos);

          const offset = new CANNON.Vec3(
            cn.x - meshWorldPos.x,
            cn.y - meshWorldPos.y,
            cn.z - meshWorldPos.z
          );

          body.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, sz.y / 2, sz.z / 2)), offset);
          body.position.set(meshWorldPos.x, meshWorldPos.y, meshWorldPos.z);
          physicsWorld.addBody(body);
          dividerBody = body;
          return;
        }

        // Buttons
        const btnName = BUTTON_NAMES.find(n => nl === n.toLowerCase());
        if (btnName) {
          if (child.material && !Array.isArray(child.material)) {
            child.material = child.material.clone();
            if (!child.material.emissive) child.material.emissive = new THREE.Color(0x000000);
            child.material.emissiveIntensity = 1;
          }
          buttons.push({ mesh: child, name: btnName, originalLocalY: child.position.y, isPressed: false });
          return;
        }

        // Hoop
        if (child.name === 'Cube001') {
          hoopMesh = child;
          window.hoopMesh = child;
          child.scale.set(1.5, 1.5, 1.5);
          hoopOrigin = child.position.clone();
          return;
        }

        // Bottom arcade machine
        if (nl === 'arcade') {
          child.updateWorldMatrix(true, false);
          if (!child.geometry) return;
          child.geometry.computeBoundingBox();

          const bb = child.geometry.boundingBox.clone();
          bb.applyMatrix4(child.matrixWorld);
          const sz = new THREE.Vector3();
          const cn = new THREE.Vector3();
          bb.getSize(sz);
          bb.getCenter(cn);

          const body = new CANNON.Body({ mass: 0, material: matFloor });
          body.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, sz.y / 4, sz.z / 2)));
          body.position.set(cn.x, cn.y / 2 - .08, cn.z);
          physicsWorld.addBody(body);

          const f = new CANNON.Body({ mass: 0, material: matFloor });
          f.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, sz.y / 2, .2)));
          f.position.set(cn.x, cn.y / 4, cn.z + sz.z / 2 - .1);
          physicsWorld.addBody(f);

          const b = new CANNON.Body({ mass: 0, material: matFloor });
          b.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, .1, sz.z / 2)));
          b.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), 0.15);
          b.position.set(cn.x, cn.y, cn.z);
          physicsWorld.addBody(b);

          const l = new CANNON.Body({ mass: 0, material: matFloor });
          l.addShape(new CANNON.Box(new CANNON.Vec3(.01, sz.y / 2, sz.z / 2)));
          l.position.set(cn.x - sz.x / 2 + .005, cn.y, cn.z);
          physicsWorld.addBody(l);

          const lg = new CANNON.Body({ mass: 0, material: matFloor });
          lg.addShape(new CANNON.Box(new CANNON.Vec3(.01, sz.y, sz.z / 4 + .5)));
          lg.position.set(cn.x - sz.x / 2 + .005, cn.y + .5, cn.z - 1);
          physicsWorld.addBody(lg);

          const r = new CANNON.Body({ mass: 0, material: matFloor });
          r.addShape(new CANNON.Box(new CANNON.Vec3(.01, sz.y / 2, sz.z / 2)));
          r.position.set(cn.x + sz.x / 2 - .005, cn.y, cn.z);
          physicsWorld.addBody(r);

          const rg = new CANNON.Body({ mass: 0, material: matFloor });
          rg.addShape(new CANNON.Box(new CANNON.Vec3(.01, sz.y, sz.z / 4 + .5)));
          rg.position.set(cn.x + sz.x / 2 - .005, cn.y + .5, cn.z - 1);
          physicsWorld.addBody(rg);

          const cg = new CANNON.Body({ mass: 0, material: matFloor });
          cg.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, .01, sz.z / 4 + .5)));
          cg.position.set(cn.x, (cn.y + 1.6) + sz.y / 2, cn.z - 1);
          physicsWorld.addBody(cg);

          const blocker = new CANNON.Body({ mass: 0, material: matFloor });
          blocker.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, sz.y / 2 - .65, .15)));
          blocker.position.set(cn.x, cn.y + .55, cn.z + 1);
          physicsWorld.addBody(blocker);
        }

        // Backboard
        if (nl === 'backboard') {
          child.updateWorldMatrix(true, false);
          if (!child.geometry) return;
          child.geometry.computeBoundingBox();

          const bb = child.geometry.boundingBox.clone();
          bb.applyMatrix4(child.matrixWorld);
          const sz = new THREE.Vector3();
          const cn = new THREE.Vector3();
          bb.getSize(sz);
          bb.getCenter(cn);

          const body = new CANNON.Body({ mass: 0, material: matFloor });
          body.addShape(new CANNON.Box(new CANNON.Vec3(sz.x / 2, sz.y, sz.z / 2)));
          body.position.set(cn.x, cn.y / 1.5, cn.z);
          physicsWorld.addBody(body);
        }
      });

      if (hoopMesh) {
        createHoopSensor();
      }

      if (buttons.length === 0) console.warn('No buttons found!', BUTTON_NAMES);

    },
    (xhr) => console.log('Loading: ' + Math.round(xhr.loaded / xhr.total * 100) + '%'),
    (err) => console.error('Model load error:', err));
  }

  // Basketball
  function createBall() {
    const pos = {
      x: (Math.random() - 0.5) * 1.3,
      y: (Math.random() - 0.5) + 2.3,
      z: (Math.random() - 0.5) * 2 - 4
    };
    const radius = 0.15;
    const basketballTexture = textureLoader.load('basketballtexture.png');
    const material = new THREE.MeshStandardMaterial({ map: basketballTexture });

    const sphereMesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), material);
    sphereMesh.position.set(pos.x, pos.y, pos.z);
    sphereMesh.castShadow = true;
    scene.add(sphereMesh);

    const sphereBody = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(radius), material: matBounce });
    sphereBody.position.copy(sphereMesh.position);
    physicsWorld.addBody(sphereBody);

    objects.push({ mesh: sphereMesh, body: sphereBody, type: 'sphere' });
    group.add(sphereMesh);
  }

  // Scoring
  function createHoopSensor() {
    const hoopWorldPos = new THREE.Vector3();
    hoopMesh.getWorldPosition(hoopWorldPos); 

    hoopSensor = new CANNON.Body({ mass: 0, isTrigger: true });
    hoopSensor.addShape(new CANNON.Cylinder(0.25, 0.25, 0.05, 16));
    hoopSensor.position.set(hoopWorldPos.x, hoopWorldPos.y, hoopWorldPos.z); 
    physicsWorld.addBody(hoopSensor);

    hoopSensor.addEventListener('collide', (e) => {
      const hitBody = e.body;
      const obj = objects.find(o => o.body === hitBody);
      if (!obj) return;
      if (scoredBalls.has(hitBody)) return; 

      if (hitBody.velocity.y < -0.5) {
        scoredBalls.add(hitBody);
        addScore(2);
        setTimeout(() => scoredBalls.delete(hitBody), 1000);
      }
    });
  }

  // Game Logic
  function onButtonPressed(btnName) {
    if (gameRunning) return;

    if (textLevelsMesh) textLevelsMesh.material.emissive.set(0x000000);
    if (textClassicMesh) textClassicMesh.material.emissive.set(0x000000);

    if (btnName.toLowerCase() === 'button_classic') {
      isLevelMode = false; 
      hoopSpeed = 0;
      if(textClassicMesh){
        textClassicMesh.material.emissive.set(0xffea00);
      }
    } else {
      isLevelMode = true; 
      hoopSpeed = 0.008;
      if (textLevelsMesh) textLevelsMesh.material.emissive.set(0xffea00);
    }
    // Reset score 
    score = 0;
    elScore.textContent = '0';
    gameRunning = true;
    dropDivider();
    startTimer();
  }

  function dropDivider() {
    if (dividerMesh) dividerTargetY = dividerRestY - DIVIDER_DROP_AMOUNT;
  }

  function raiseDivider() {
    if (dividerMesh) dividerTargetY = dividerRestY;
  }

  function animateDivider() {
    if (!dividerMesh || dividerTargetY === null) return;
    const diff = dividerTargetY - dividerMesh.position.y;
    const worldPos = new THREE.Vector3();
    if (Math.abs(diff) <= DIVIDER_SPEED) {
      dividerMesh.position.y = dividerTargetY;
      dividerTargetY = null;
      dividerMesh.getWorldPosition(worldPos);
      dividerBody.position.set(worldPos.x, worldPos.y, worldPos.z);
      dividerBody.velocity.set(0, 0, 0);
      return;
    }
    dividerMesh.position.y += Math.sign(diff) * DIVIDER_SPEED;
    dividerMesh.getWorldPosition(worldPos);
    dividerBody.position.set(worldPos.x, worldPos.y, worldPos.z);
    dividerBody.velocity.set(0, 0, 0);
  }

  // Timer
  function startTimer() {
    timerSecondsLeft = GAME_DURATION;
    timerLastTimestamp = null;
    timerRunning = true;
    currentLevel = 1;
    levelTimer = 0;
    updateHUD(timerSecondsLeft);
  }

  function tickTimer(now) {
    if (!timerRunning) return;
    if (timerLastTimestamp === null) { timerLastTimestamp = now; return; }
    const elapsed = (now - timerLastTimestamp) / 1000;
    timerLastTimestamp = now;
    const prev = timerSecondsLeft;
    timerSecondsLeft = Math.max(0, timerSecondsLeft - elapsed);
    if (Math.floor(prev) !== Math.floor(timerSecondsLeft)) updateHUD(Math.ceil(timerSecondsLeft));
    if (timerSecondsLeft <= 0) { timerRunning = false; onTimerExpired(); }
  }

  function onTimerExpired() {
    timerRunning = false;
    updateHUD(0);
    raiseDivider();
    gameRunning = false;
    hoopSpeed = 0;

    if (hoopMesh && hoopOrigin) {
      hoopMesh.position.copy(hoopOrigin);
      hoopDirection = 1;
      hoopVerticalDir = 1;
    }

    if (textLevelsMesh) textLevelsMesh.material.emissive.set(0x000000);
    if (textClassicMesh) textClassicMesh.material.emissive.set(0x000000);
  }

  // Hoop 
  function animateHoop() {
    if (!hoopMesh || !isLevelMode) return;
    hoopMesh.position.x += hoopDirection * hoopSpeed;
    if (hoopMesh.position.x > 0.5 || hoopMesh.position.x < -0.5) hoopDirection *= -1;
    hoopMesh.position.y += hoopVerticalDir * hoopSpeed;
    if (hoopMesh.position.y > 2.5 || hoopMesh.position.y < 2.0) hoopVerticalDir *= -1;

    if (hoopSensor) {
      const worldPos = new THREE.Vector3();
      hoopMesh.getWorldPosition(worldPos);
      hoopSensor.position.set(worldPos.x, worldPos.y, worldPos.z);
    }
  }

  function updateLevels(delta) {
    if (!isLevelMode || !gameRunning) return;
    levelTimer += delta;
    if (levelTimer > 10) { currentLevel++; levelTimer = 0; hoopSpeed += 0.003; }
  }

  // Controller 
  function onSelectStart(event) {
    const controller = event.target;
    raycaster.setFromXRController(controller);
    const hits = raycaster.intersectObjects(buttons.map(b => b.mesh), false);
    if (hits.length > 0) {
      const btn = buttons.find(b => b.mesh === hits[0].object);
      if (!btn || btn.isPressed) return;
      btn.isPressed = true;
      btn.mesh.position.y = btn.originalLocalY - PRESS_DEPTH;
      if (btn.mesh.material?.emissive) btn.mesh.material.emissive.set(0x0044ff);
      onButtonPressed(btn.name);
      return;
    }
    tryGrab(controller);
  }

  function tryGrab(controller) {
    raycaster.setFromXRController(controller);
    const hits = raycaster.intersectObjects(objects.map(o => o.mesh), false);
    if (!hits.length) return;
    const obj = objects.find(o => o.mesh === hits[0].object);
    if (!obj) return;
    heldObject = obj; holdinController = controller;
    obj.body.type = CANNON.Body.KINEMATIC;
    obj.body.velocity.set(0, 0, 0);
    obj.body.angularVelocity.set(0, 0, 0);
    prevControllerPos.copy(controller.getWorldPosition(new THREE.Vector3()));
  }

  function onSelectEnd(event) {
    if (heldObject && holdinController) {
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(holdinController.quaternion);
      dir.y += 0.5;
      dir.normalize();
      const s = 8;
      heldObject.body.type = CANNON.Body.DYNAMIC;
      heldObject.body.velocity.set(dir.x * s, dir.y * s, dir.z * s);
      heldObject = null; holdinController = null;
    }
    buttons.forEach(btn => {
      if (!btn.isPressed) return;
      btn.isPressed = false;
      btn.mesh.position.y = btn.originalLocalY;
      if (btn.mesh.material?.emissive) btn.mesh.material.emissive.set(0x000000);
    });
  }

  function onSqueezeStart(event) {
    const point = getTeleportPoint(event.target);
    if (!point) return;
    const c = clampToRadius(point);
    player.position.set(c.x, 0.6, c.z);
  }

  //Locomotion 
  function updateHover(controller) {
    if (buttons.some(b => b.isPressed)) return;
    raycaster.setFromXRController(controller);
    const laser = controller.getObjectByName('laser');
    const hits  = raycaster.intersectObjects(buttons.map(b => b.mesh), false);
    if (hits.length > 0) {
      const btn = buttons.find(b => b.mesh === hits[0].object);
      if (btn && !hovered.includes(btn.mesh)) {
        if (btn.mesh.material?.emissive) btn.mesh.material.emissive.set(0xff2200);
        hovered.push(btn.mesh);
      }
      if (laser) laser.scale.z = hits[0].distance;
    } else {
      if (laser) laser.scale.z = LASER_LENGTH;
    }
  }

  function clearHover() {
    while (hovered.length) {
      const mesh = hovered.pop();
      const btn  = buttons.find(b => b.mesh === mesh);
      if (btn && !btn.isPressed && mesh.material?.emissive) mesh.material.emissive.set(0x000000);
    }
  }

  function getTeleportPoint(controller) {
    raycaster.setFromXRController(controller);
    const hits = raycaster.intersectObject(floor);
    return hits.length > 0 ? hits[0].point : null;
  }

  function clampToRadius(point) {
    const R = 2, origin = new THREE.Vector3(0, 0, 0);
    if (point.z < -0.4) point.z = -0.4;
    const off = point.clone().sub(origin);
    if (off.length() > R) off.normalize().multiplyScalar(R);
    return origin.clone().add(off);
  }

  function updateTeleportPreview(controller) {
    const point = getTeleportPoint(controller);
    if (point) { marker.position.copy(clampToRadius(point)); marker.visible = true; }
    else { marker.visible = false; }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate(now) {
    const delta = clock.getDelta();
    cannonDebugger.update();
    physicsWorld.step(1 / 60, delta, 3);

    objects.forEach(obj => {
      if (obj === heldObject) return;
      obj.mesh.position.copy(obj.body.position);
      obj.mesh.quaternion.copy(obj.body.quaternion);
    });

    if (heldObject && holdinController) {
      const wp = new THREE.Vector3();
      holdinController.getWorldPosition(wp);
      heldObject.mesh.position.copy(wp);
      heldObject.body.position.set(wp.x, wp.y, wp.z);
      heldObject.body.wakeUp();
    }

    clearHover();
    updateHover(controller1);
    updateHover(controller2);
    animateDivider();
    animateHoop();
    updateLevels(delta);
    updateTeleportPreview(controller1);
    updateTeleportPreview(controller2);
    tickTimer(now);
    renderer.render(scene, camera);
  }

</script>
</body>
